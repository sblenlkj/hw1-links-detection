name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v

  container:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Export production requirements
        run: |
          uv export \
            --frozen \
            --no-dev \
            --no-emit-project \
            -o requirements.txt

      - name: Build image
        run: docker build -t law-links-service:test .

      - name: Start container
        run: |
          docker run -d \
            --name law-links-service \
            -p 8978:8978 \
            law-links-service:test

      - name: Smoke test
        run: |
          for i in {1..20}; do
            if curl --fail --silent --show-error \
              http://localhost:8978/health; then
              exit 0
            fi
            sleep 1
          done

          docker logs law-links-service
          exit 1

      - name: Stop container
        if: always()
        run: |
          docker rm -f law-links-service || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        run: |
          docker tag law-links-service:test "${IMAGE_NAME}:latest"
          docker tag law-links-service:test "${IMAGE_NAME}:${GITHUB_REF_NAME}"

      - name: Push image
        run: |
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${GITHUB_REF_NAME}"
